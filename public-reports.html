<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lịch & báo cáo kỹ sư | K-Workspace</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    dialog::backdrop { background: rgb(15 23 42 / .52); backdrop-filter: blur(3px); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-20 bg-slate-50/95 backdrop-blur">
    <div class="mx-auto max-w-6xl px-3 pt-3 sm:px-6 sm:pt-4">
      <div class="flex min-h-[68px] items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white px-3.5 py-3 shadow-sm sm:min-h-[76px] sm:px-5">
        <div class="flex min-w-0 items-center gap-3">
          <img src="images/symbol.png" alt="Phúc Sinh" class="h-9 w-auto shrink-0 object-contain sm:h-10">
          <div class="min-w-0">
            <h1 class="truncate text-sm font-extrabold text-slate-900 sm:text-base">Lịch trực & báo cáo kỹ sư</h1>
            <p class="mt-0.5 truncate text-[10px] text-slate-500 sm:text-[11px]">Workspace <span class="mx-1 text-slate-300">›</span> Lịch kỹ sư</p>
          </div>
        </div>
        <a href="login.html" class="shrink-0 rounded-xl border border-slate-200 px-3 py-2 text-[11px] font-bold text-slate-700 transition hover:bg-slate-50 sm:px-4 sm:text-xs">← Đăng nhập</a>
      </div>
    </div>
  </header>

  <main class="safe-bottom mx-auto max-w-6xl space-y-4 px-3 pb-5 pt-4 sm:px-6 sm:pb-7 sm:pt-5">
    <section aria-label="Báo cáo tổng quan tháng" class="grid grid-cols-2 gap-2.5 sm:grid-cols-4 sm:gap-3">
      <article class="rounded-xl border border-slate-200 bg-white p-3 sm:rounded-2xl sm:p-4"><p class="text-[11px] font-semibold text-slate-500">Kỹ sư</p><p id="summary-engineers" class="mt-1 text-xl font-extrabold sm:text-2xl">—</p></article>
      <article class="rounded-xl border border-slate-200 bg-white p-3 sm:rounded-2xl sm:p-4"><p class="text-[11px] font-semibold text-slate-500">Tổng số ca</p><p id="summary-shifts" class="mt-1 text-xl font-extrabold sm:text-2xl">—</p></article>
      <article class="rounded-xl border border-slate-200 bg-white p-3 sm:rounded-2xl sm:p-4"><p class="text-[11px] font-semibold text-emerald-700">Đã duyệt</p><p id="summary-approved" class="mt-1 text-xl font-extrabold text-emerald-700 sm:text-2xl">—</p></article>
      <article class="rounded-xl border border-slate-200 bg-white p-3 sm:rounded-2xl sm:p-4"><p class="text-[11px] font-semibold text-amber-700">Chờ duyệt</p><p id="summary-pending" class="mt-1 text-xl font-extrabold text-amber-700 sm:text-2xl">—</p></article>
    </section>

    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white">
      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-slate-100 px-3 py-3 sm:px-4">
        <div class="flex items-center gap-2">
          <button id="month-today" type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-[11px] font-bold text-slate-700 hover:bg-slate-50">Hôm nay</button>
          <button id="month-previous" type="button" aria-label="Tháng trước" class="grid h-9 w-9 place-items-center rounded-lg text-lg text-slate-600 hover:bg-slate-100">‹</button>
          <button id="month-next" type="button" aria-label="Tháng sau" class="grid h-9 w-9 place-items-center rounded-lg text-lg text-slate-600 hover:bg-slate-100">›</button>
          <span id="month-label" class="ml-1 min-w-28 rounded-lg bg-slate-50 px-2.5 py-2 text-center text-xs font-extrabold text-slate-800 sm:text-sm">—</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-semibold text-slate-500"><span class="h-2 w-2 rounded-full bg-emerald-600"></span>Đã duyệt<span class="ml-1 h-2 w-2 rounded-full bg-amber-500"></span>Chờ duyệt</div>
      </div>
      <div class="flex min-h-12 items-center gap-2 overflow-x-auto border-b border-slate-100 px-3 py-2 sm:px-4">
        <span class="sticky left-0 z-10 shrink-0 bg-white pr-1 text-[9px] font-extrabold uppercase tracking-wide text-slate-400">Kỹ sư</span>
        <div id="engineer-filters" class="flex min-w-0 items-center gap-1.5"><span class="text-xs text-slate-500">Đang tải…</span></div>
      </div>
      <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center text-[9px] font-extrabold uppercase tracking-wide text-slate-500 sm:text-[10px]">
        <div class="py-2">Thứ 2</div><div class="py-2">Thứ 3</div><div class="py-2">Thứ 4</div><div class="py-2">Thứ 5</div><div class="py-2">Thứ 6</div><div class="py-2">Thứ 7</div><div class="py-2">Chủ nhật</div>
      </div>
      <div id="calendar-grid" class="grid grid-cols-7"><div class="col-span-7 p-5 text-center text-sm text-slate-500">Đang tải lịch…</div></div>
    </section>
    <p id="report-message" role="status" aria-live="polite" class="min-h-4 text-center text-[11px] text-slate-500"></p>
    <p class="text-center text-[10px] text-slate-400">Trang chỉ xem lịch và thống kê. Không thể đặt lịch hoặc sửa dữ liệu.</p>
  </main>

  <dialog id="schedule-detail-dialog" class="m-auto w-[calc(100%-1.5rem)] max-w-lg rounded-2xl p-0 shadow-2xl">
    <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-4 py-3.5 sm:px-5">
      <div><h2 id="detail-title" class="text-base font-extrabold text-slate-900">Chi tiết ca</h2><p id="detail-subtitle" class="mt-0.5 text-xs text-slate-500"></p></div>
      <button id="detail-close" type="button" aria-label="Đóng" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100">×</button>
    </div>
    <div id="detail-content" class="max-h-[70vh] overflow-y-auto p-4 sm:p-5"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/core/supabase.js"></script>
  <script src="assets/js/modules/booking/public-reports.js"></script>
</body>
</html>
