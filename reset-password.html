<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Đặt lại mật khẩu | K-Workspace</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
  <script src="assets/js/core/design-system.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#f6f8fb] flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased">
  <main class="w-full max-w-md rounded-2xl border border-slate-200/90 bg-white p-5 sm:p-7 shadow-xs">
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
      <img src="images/logo-full.png" alt="Phúc Sinh Consumers" class="h-9 sm:h-10 w-auto object-contain">
      <span class="font-condensed px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-brand-50 text-brand-700 border border-brand-200">Bảo mật tài khoản</span>
    </div>
    <h1 class="font-condensed text-2xl font-bold text-brand-600 tracking-tight uppercase">Đặt lại mật khẩu</h1>
    <p class="mt-1.5 text-xs text-slate-500 leading-relaxed">Tạo mật khẩu mới cho tài khoản K-Workspace của bạn.</p>
    <div id="reset-loading" class="mt-4 rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs text-slate-600 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-brand-600 animate-ping"></span>
      <span>Đang xác thực liên kết bảo mật từ email...</span>
    </div>
    <div id="reset-error" class="hidden mt-4 rounded-xl bg-rose-50 border border-rose-200 p-3.5 text-xs text-rose-700 leading-relaxed" role="alert"></div>
    <form id="reset-form" class="hidden mt-5 space-y-4">
      <div>
        <label for="new-password" class="block text-xs font-bold text-slate-700 mb-1.5">Mật khẩu mới (tối thiểu 6 ký tự)</label>
        <input id="new-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Nhập mật khẩu mới" class="w-full min-h-[44px] rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white px-3.5 py-2.5 text-xs text-slate-900 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
      </div>
      <div>
        <label for="confirm-password" class="block text-xs font-bold text-slate-700 mb-1.5">Nhập lại mật khẩu mới</label>
        <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Xác nhận mật khẩu mới" class="w-full min-h-[44px] rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white px-3.5 py-2.5 text-xs text-slate-900 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
      </div>
      <p id="reset-form-error" class="hidden text-xs font-medium text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5" role="alert"></p>
      <button id="reset-submit" type="submit" class="w-full min-h-[44px] rounded-xl bg-brand-600 hover:bg-brand-700 px-4 py-3 text-xs font-bold text-white shadow-xs transition-all cursor-pointer">Lưu mật khẩu mới</button>
    </form>
    <p id="reset-success" class="hidden mt-4 rounded-xl bg-accent-50 border border-accent-200 p-3.5 text-xs font-semibold text-accent-700" role="status">Mật khẩu đã được cập nhật thành công! Bạn có thể đăng nhập ngay.</p>
    <a id="login-link" href="login.html" class="hidden mt-4 inline-flex items-center gap-1.5 text-xs font-bold text-brand-600 hover:text-brand-700 hover:underline">← Quay lại trang đăng nhập</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/core/supabase.js"></script>
  <script>
    const resetClient = window.SupabaseConfig?.getClient();
    const resetLoading = document.getElementById('reset-loading');
    const resetError = document.getElementById('reset-error');
    const resetForm = document.getElementById('reset-form');
    const resetLoginLink = document.getElementById('login-link');

    function showResetError(message) {
      if (resetLoading) resetLoading.classList.add('hidden');
      resetError.textContent = message;
      resetError.classList.remove('hidden');
      resetForm.classList.add('hidden');
      resetLoginLink.classList.remove('hidden');
    }

    function showResetForm() {
      if (resetLoading) resetLoading.classList.add('hidden');
      resetError.classList.add('hidden');
      resetForm.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!resetClient?.auth) return showResetError('Không kết nối được dịch vụ xác thực.');

      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const errorDesc = searchParams.get('error_description') || hashParams.get('error_description');
      if (errorDesc) {
        return showResetError(`Link email không hợp lệ hoặc đã hết hạn (${decodeURIComponent(errorDesc.replace(/\+/g, ' '))}). Vui lòng yêu cầu gửi lại link mới.`);
      }

      const tokenHash = searchParams.get('token_hash');
      const otpType = searchParams.get('type') || hashParams.get('type') || 'recovery';
      const code = searchParams.get('code');

      if (tokenHash) {
        const { error } = await resetClient.auth.verifyOtp({ token_hash: tokenHash, type: otpType });
        if (error) {
          return showResetError('Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Hãy yêu cầu gửi link mới.');
        }
        return showResetForm();
      }

      if (code) {
        const { error } = await resetClient.auth.exchangeCodeForSession(code);
        if (error) {
          return showResetError('Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Hãy yêu cầu gửi link mới.');
        }
        return showResetForm();
      }

      const { data: { session }, error } = await resetClient.auth.getSession();
      if (!error && session?.user) {
        return showResetForm();
      }

      resetClient.auth.onAuthStateChange((event, newSession) => {
        if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && newSession?.user) {
          showResetForm();
        }
      });

      setTimeout(async () => {
        const { data: { session: retrySession } } = await resetClient.auth.getSession();
        if (retrySession?.user) {
          showResetForm();
        } else if (resetForm.classList.contains('hidden')) {
          showResetError('Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Hãy yêu cầu gửi link mới.');
        }
      }, 1500);
    });

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const formError = document.getElementById('reset-form-error');
      if (password.length < 6) {
        formError.textContent = 'Mật khẩu cần có ít nhất 6 ký tự.';
        formError.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        formError.textContent = 'Hai mật khẩu không khớp.';
        formError.classList.remove('hidden');
        return;
      }
      formError.classList.add('hidden');
      const button = document.getElementById('reset-submit');
      button.disabled = true;
      button.textContent = 'Đang lưu mật khẩu...';
      if (window.SystemLoader) {
        window.SystemLoader.show('Đang cập nhật mật khẩu mới…', 'Đang lưu mật khẩu bảo mật lên máy chủ xác thực…');
      }
      try {
        const { error } = await resetClient.auth.updateUser({ password });
        if (error) {
          button.disabled = false;
          button.textContent = 'Lưu mật khẩu mới';
          formError.textContent = error.message || 'Không thể cập nhật mật khẩu.';
          formError.classList.remove('hidden');
          return;
        }
        await resetClient.auth.signOut();
        resetForm.classList.add('hidden');
        document.getElementById('reset-success').classList.remove('hidden');
        resetLoginLink.classList.remove('hidden');
      } finally {
        if (window.SystemLoader) window.SystemLoader.hide();
      }
    });
  </script>
</body>
</html>
